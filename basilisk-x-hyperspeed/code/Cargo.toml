[package]
name = "basilisk-x-hyperspeed"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# What crosses to InputHub and back, so that none of the code here is unsafe.
inputhub-plugin = { git = "https://github.com/inputhub/inputhub" }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
